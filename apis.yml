apis:
- aid: transit:url-scheme
  name: Transit URL Scheme
  description: >-
    Deep-link URL scheme for launching the Transit mobile app from partner apps and websites. Supports
    directions and nearby-routes hand-offs without requiring an API key.
  humanURL: https://transitapp.com/apis
  baseURL: transit://
  tags:
  - Deep Linking
  - Mobile
  - URL Scheme
  - Public Transit
  properties:
  - type: Documentation
    url: https://transitapp.com/apis
  x-features:
  - transit://directions?from=[location]&to=[location]
  - transit://routes?q=[location]
  - No API key required
  x-use-cases:
  - Partner-app hand-off for last-mile navigation
  - Web map "Open in Transit" buttons
  - Travel app multimodal routing
