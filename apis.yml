aid: transit
name: Transit
description: >-
  Transit provides real-time public transit data, trip planning, and multimodal
  mobility solutions across 900 cities in 25 countries. The platform aggregates
  data for trains, buses, bikes, scooters, and carshares, offering accurate
  real-time departure times and intuitive trip planning.
type: Index
position: Consumer
access: 3rd-Party
image: https://kinlane-productions.s3.amazonaws.com/apis-json/apis-json-logo.jpg
tags:
  - Public Transit
  - Real-Time
  - Trip Planning
  - Multimodal
  - GTFS
  - Mobility
created: '2025-05-02'
modified: '2026-05-03'
url: >-
  https://raw.githubusercontent.com/api-evangelist/transit/refs/heads/main/apis.yml
