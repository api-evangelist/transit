aid: transit
name: Transit
description: >-
  Transit ("The world's most accurate transit app") provides real-time public transit data, multimodal trip planning,
  and shared mobility across 1,000+ cities including New York, Paris, London, and Montreal, partnering with 180+ transit
  agencies. The platform aggregates trains, buses, bikes, scooters, and carshares with crowdsourced GO real-time
  signals, ships a freemium partner API (5 calls/minute, 1,500 calls/month), and monetizes consumers via the Transit
  Royale subscription ($2/month billed annually).
type: Index
accessModel:
  pricing: freemium
  onboarding: self-serve
  trial: false
  try_now: true
  public: false
  label: Freemium · Self-serve signup
  confidence: high
  source:
  - plans
  - authentication
  generated: '2026-07-22'
  method: derived
position: Consumer
access: 3rd-Party
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/transit.png
tags:
  - Public Transit
  - Real-Time
  - Trip Planning
  - Multimodal
  - GTFS
  - GOFS
  - Mobility
  - Shared Mobility
created: '2025-05-02'
modified: '2026-05-23'
